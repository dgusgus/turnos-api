# Desarrollo:     docker compose up -d db      (solo la base; la API corre con `pnpm dev`)
# Todo en Docker: docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: turnos_api
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d turnos_api"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/turnos_api?schema=public
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en tu .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}

volumes:
  pgdata:
